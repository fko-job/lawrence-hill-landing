services:
  app:
    build: .
    container_name: lawrencehill-app
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - 3000
    volumes:
      - ./data:/app/data
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-network"
      # Subdomain Router (ready whenever DNS record is created)
      - "traefik.http.routers.lawrencehill.rule=Host(`lawrencehill.jeffreyshew.com`) || Host(`staging-lawrencehill.jeffreyshew.com`)"
      - "traefik.http.routers.lawrencehill.entrypoints=websecure"
      - "traefik.http.routers.lawrencehill.tls=true"
      - "traefik.http.routers.lawrencehill.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lawrencehill.service=lawrencehill-svc"
      # Instant Path Router on both production and staging domains
      - "traefik.http.routers.lawrencehill-path.rule=(Host(`jeffreyshew.com`) || Host(`www.jeffreyshew.com`) || Host(`staging.jeffreyshew.com`)) && (PathPrefix(`/lawrence-hill`) || PathPrefix(`/lawrencehill`))"
      - "traefik.http.routers.lawrencehill-path.entrypoints=websecure"
      - "traefik.http.routers.lawrencehill-path.tls=true"
      - "traefik.http.routers.lawrencehill-path.priority=100"
      - "traefik.http.routers.lawrencehill-path.middlewares=lh-strip"
      - "traefik.http.routers.lawrencehill-path.service=lawrencehill-svc"
      - "traefik.http.middlewares.lh-strip.stripprefix.prefixes=/lawrence-hill,/lawrencehill"
      - "traefik.http.services.lawrencehill-svc.loadbalancer.server.port=3000"

networks:
  proxy-network:
    external: true
